<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Calculator</title>
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="calc-container">
      <div class="display-container">
        <div class="top-display">top display</div>
	<div class="bottom-display">bottom display</div>
      </div>
      <div class="numpad-container">
        <div class="num-container">
          <div class="clear">
            <button>C/AC</button>
	  </div>
          <div class="num-7-9">
            <button>7</button>
            <button>8</button>
            <button>9</button>
	  </div>
	  <div class="num-4-6">
            <button>4</button>
            <button>5</button>
            <button>6</button>
	  </div>
	  <div class="num-1-3">
            <button>1</button>
            <button>2</button>
            <button>3</button>
	  </div>
	  <div class="num-0-.">
	    <button>(-)</button>
            <button>0</button>
            <button>.</button>
	  </div>
	</div>
	<div class="operator-container">
          <button>/</button>
          <button>x</button>
          <button>-</button>
          <button>+</button>
          <button>=</button>
	</div>
      </div>
    </div>
  </body>
</html>
