<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="calc-container">
      <div class="displays-container">
        <div class="top-display-container">
          <div class="top-display">top display</div>
	</div>
	<div class="bottom-display-container">
	  <div class="bottom-display">bottom display</div>
	</div>
      </div>
      <div class="numpad-container">
        <div class="nums-container">
          <div class="nums">
            <button class="key clr">C/AC</button>
	  </div>
          <div class="nums">
            <button class="key num">7</button>
            <button class="key num">8</button>
            <button class="key num">9</button>
	  </div>
	  <div class="nums">
            <button class="key num">4</button>
            <button class="key num">5</button>
            <button class="key num">6</button>
	  </div>
	  <div class="nums">
            <button class="key num">1</button>
            <button class="key num">2</button>
            <button class="key num">3</button>
	  </div>
	  <div class="nums">
	    <button class="key neg">(-)</button>
            <button class="key num">0</button>
            <button class="key dec">.</button>
	  </div>
	</div>
	<div class="operators-container">
          <button class="key operator">/</button>
          <button class="key operator">x</button>
          <button class="key operator">-</button>
          <button class="key operator">+</button>
          <button class="key operator">=</button>
	</div>
      </div>
    </div>
  </body>

  <script src="./script.js"></script>
</html>
