<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="calc-container">
      <div class="displays-container">
        <div class="top-display-container">
          <div class="top-display">top display</div>
	</div>
	<div class="bottom-display-container">
	  <div class="bottom-display">bottom display</div>
	</div>
      </div>
      <div class="numpad-container">
        <div class="nums-container">
          <div class="nums">
            <button class="num">C/AC</button>
	  </div>
          <div class="nums">
            <button class="num">7</button>
            <button class="num">8</button>
            <button class="num">9</button>
	  </div>
	  <div class="nums">
            <button class="num">4</button>
            <button class="num">5</button>
            <button class="num">6</button>
	  </div>
	  <div class="nums">
            <button class="num">1</button>
            <button class="num">2</button>
            <button class="num">3</button>
	  </div>
	  <div class="nums">
	    <button class="num">(-)</button>
            <button class="num">0</button>
            <button class="num">.</button>
	  </div>
	</div>
	<div class="operators-container">
          <button class="operator">/</button>
          <button class="operator">x</button>
          <button class="operator">-</button>
          <button class="operator">+</button>
          <button class="operator">=</button>
	</div>
      </div>
    </div>
  </body>
</html>
